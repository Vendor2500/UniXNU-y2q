name: metal-userland

# Builds the 22H374 Metal discovery bundle (Turnip + metal2vulkan bridge +
# PongAdrenoMetal plugin) from public sources only. No IPSW, no Apple binaries,
# no device access. The bundle accepts the A730 and the SM-T970 A650.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner image"
        type: choice
        options: ["macos-15", "macos-14", "macos-26"]
        default: "macos-15"

permissions:
  contents: read

concurrency:
  group: metal-userland-${{ github.ref }}
  cancel-in-progress: true

env:
  MESA_PIN: 85fda3b36405bcaea8bffc64aa4f2651dc90770d
  M2V_PIN: 624bab3918de5b978e1101517abca2b4fa426565

jobs:
  bundle:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: submodules (PongMetal, PongAdreno)
        run: git submodule update --init --depth 50 drivers/PongMetal drivers/PongAdreno

      - name: toolchain
        run: |
          set -euo pipefail
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          brew install bison flex ninja glslang llvm@18 || true
          # the bridge assembles the scanout AIR kernel with LLVM 18's llvm-as (as MacPorts llvm-as-mp-18 upstream)
          echo "PONG_LLVM_AS=$(brew --prefix llvm@18)/bin/llvm-as" >> "$GITHUB_ENV"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q meson mako pyyaml packaging
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version; cargo --version; bison --version | head -1

      - name: fetch pinned sources
        run: |
          set -euo pipefail
          fetch() { # dir url pin [fallback-url]
            git init -q "$1"
            git -C "$1" remote add origin "$2"
            if ! git -C "$1" fetch -q --depth 1 origin "$3"; then
              test -n "${4:-}" && git -C "$1" remote set-url origin "$4" && git -C "$1" fetch -q --depth 1 origin "$3"
            fi
          }
          fetch "$RUNNER_TEMP/mesa-src" https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_PIN" https://github.com/mesa3d/mesa.git
          fetch "$RUNNER_TEMP/m2v-src" https://github.com/steelbrain/metal2vulkan.git "$M2V_PIN"

      - name: T970 patches and the parity builders
        run: |
          set -euo pipefail
          python3 scripts/patch_pong_metal_t970.py .
          # the parity114 translator and parity167 Mesa pair with the overlay builders
          # (migration/ipados18/runtime-fixes-and-build-overlay.md), not the 20G81-era ones
          cp kits/PongPlatform24/build-support/merged-scripts/build-pong-{turnip,metal-bridge,metal-plugin}.py scripts/

      - name: prepare trees
        run: |
          set -euo pipefail
          python3 scripts/prepare-pong-mesa.py --repository "$RUNNER_TEMP/mesa-src" --out "$RUNNER_TEMP/mesa"
          python3 scripts/prepare-pong-metal-parity.py --repository "$RUNNER_TEMP/m2v-src" --out "$RUNNER_TEMP/m2v"

      - name: Turnip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          python3 scripts/build-pong-turnip.py --mesa "$RUNNER_TEMP/mesa" \
            --abi-directory drivers/PongAdreno/submit --tools-directory "$RUNNER_TEMP/tools" \
            --venv "$RUNNER_TEMP/venv" --output-dir out/turnip --guest-build 22H374 \
            || { tail -150 out/turnip/configure.log; tail -200 out/turnip/build.log 2>/dev/null; exit 1; }

      - name: metal2vulkan bridge
        run: |
          set -euo pipefail
          python3 scripts/build-pong-metal-bridge.py --translator "$RUNNER_TEMP/m2v" \
            --guest-build 22H374 --output-dir out/bridge \
            || { tail -200 out/bridge/cargo-build.log 2>/dev/null; tail -100 out/bridge/link.log 2>/dev/null; exit 1; }

      - name: plugin bundle
        run: |
          set -euo pipefail
          python3 scripts/build-pong-metal-plugin.py --bridge-directory out/bridge --guest-build 22H374 \
            --turnip-library out/turnip/src/freedreno/vulkan/libvulkan_freedreno.dylib --output-dir out/metal
          ls -la out/metal out/metal/PongAdrenoMetal.bundle
          for f in out/metal/PongAdrenoMetal.bundle/*; do file "$f"; done
          otool -L out/metal/PongAdrenoMetal.bundle/PongAdrenoMetal
          shasum -a 256 out/metal/PongAdrenoMetal.bundle/* | tee out/metal/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: pong-metal-22H374
          path: |
            out/metal
            out/turnip/build-report.json
            out/bridge/build-report.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: metal-userland-logs
          path: |
            out/**/*.log
          if-no-files-found: ignore
